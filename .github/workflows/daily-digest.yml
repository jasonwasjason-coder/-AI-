name: Daily AI Digest → WeChat Work

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只生成摘要，不发送到企业微信（调试用）'
        type: boolean
        default: false

permissions:
  models: read

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate and send digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: python scripts/send_digest.py
